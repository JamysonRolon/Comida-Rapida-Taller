spring.application.name=comidas-rapidas
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/comidas_rapidas}
spring.datasource.username=${DB_USER:comidas_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
logging.level.root=WARN
app.zone=America/Bogota
app.demo-data.enabled=${DEMO_DATA:false}
app.demo-data.daniel-password=${DEMO_DANIEL_PASSWORD:}
app.demo-data.juan-password=${DEMO_JUAN_PASSWORD:}
